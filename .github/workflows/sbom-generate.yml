name: Verify mirrored SBOMs

# The dependency SBOMs are generated inside the private build workflows, where
# the patched/overridden source tree exists.  This public workflow only checks
# that the mirrored metadata is present and that the component summary's
# checksums match the published SHA256SUMS.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mirrored-sboms
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download public release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download agent-binaries \
            --repo yunix-intel/loongarch-agent-toolkit \
            --pattern 'SBOM.spdx.json' \
            --pattern 'SHA256SUMS' -D release
          # Per-artifact SBOMs are optional until the private build produces
          # them; the component summary is mandatory.
          gh release download agent-binaries \
            --repo yunix-intel/loongarch-agent-toolkit \
            --pattern 'SBOM-*.spdx.json' -D release || true
          ls -l release

      - name: Validate SPDX and checksums
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("release")
          sums = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              parts = line.split()
              if len(parts) >= 2:
                  sums[parts[1].lstrip("*")] = parts[0].lower()

          document = json.loads((root / "SBOM.spdx.json").read_text(encoding="utf-8"))
          errors = []
          packages = document.get("packages", [])
          if not packages:
              print("SBOM.spdx.json: no packages", file=sys.stderr)
              sys.exit(1)
          package_names = {p.get("name", "") for p in packages}
          for package in packages:
              name = package.get("name", "")
              for checksum in package.get("checksums", []):
                  if checksum.get("algorithm") != "SHA256":
                      continue
                  want = checksum.get("checksumValue", "").lower()
                  got = sums.get(name)
                  if got is None:
                      errors.append(f"{name}: missing from SHA256SUMS")
                  elif got != want:
                      errors.append(f"{name}: SBOM {want} != SHA256SUMS {got}")
          missing = [
              name for name in sums
              if (name.endswith(".tar.gz") or name.endswith(".deb"))
              and name not in package_names
          ]
          errors.extend(f"{name}: binary has no SBOM package" for name in sorted(missing))
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"SBOM.spdx.json: {len(packages)} packages match SHA256SUMS")

          for path in sorted(root.glob("SBOM-*.spdx.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              count = len(data.get("packages", []))
              if count == 0:
                  print(f"{path.name}: no packages", file=sys.stderr)
                  sys.exit(1)
              print(f"{path.name}: {count} packages")
          PY
