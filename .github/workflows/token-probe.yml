name: token-probe

# Temporary diagnostic: print only HTTP status codes for AUTO_ALIGN_TOKEN.
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repo and release access
        env:
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${AUTO_ALIGN_TOKEN:-}" ] || { echo "token is empty"; exit 1; }
          for repo in \
            yunix-intel/loongarch-agent-builds \
            yunix-intel/cc-switch-loongarch \
            yunix-intel/loongarch-agent-toolkit; do
            repo_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $AUTO_ALIGN_TOKEN" \
              "https://api.github.com/repos/$repo")
            rel_code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $AUTO_ALIGN_TOKEN" \
              "https://api.github.com/repos/$repo/releases?per_page=1")
            echo "$repo repo=$repo_code releases=$rel_code"
          done
