name: Promote staged binaries

# Manual publication gate.  The private releases are the staging area; the
# scheduled Check agent binaries workflow only reports on them.  This workflow
# verifies the current private releases again and, with dry_run=false, writes
# the public agent-binaries release.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE to confirm publication'
        required: true
        type: string
      dry_run:
        description: 'Verify and print the plan without publishing'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-mirror
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PROMOTE" ]; then
            echo "confirm must be PROMOTE; refusing to publish" >&2
            exit 1
          fi

      - name: Verify and publish
        env:
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            MODE=check
          else
            MODE=promote
          fi
          export MODE
          bash scripts/mirror-agent-assets.sh

      - name: Run post-promotion verification and attestation
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run sbom-generate.yml --repo "${{ github.repository }}"
          gh workflow run mirror-attest.yml --repo "${{ github.repository }}"
