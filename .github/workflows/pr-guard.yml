name: PR guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"

      - name: Check version manifest consistency
        run: bash .github/scripts/check-versions-consistency.sh

      - name: Check for unmerged conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.png'; then
            echo "conflict markers found" >&2
            exit 1
          fi
