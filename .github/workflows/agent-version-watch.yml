name: agent-version-watch

# Daily check + automatic alignment of the agent versions pinned in
# install/versions.env.
#
# selected = the newest version actually usable on LoongArch, which is not
# always the upstream latest (see docs/version-policy.md).
#
# The workflow runs on GitHub-hosted ubuntu-latest, never installs anything and
# never commits to main.  When a newer usable version exists it updates the
# manifest/installer/README on the auto/version-alignment branch and opens (or
# updates) a pull request.  Otherwise it only refreshes the tracking issue.

on:
  schedule:
    # 02:17 UTC daily (off the hour to avoid the cron rush).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report; do not push the alignment branch or open a PR"
        type: boolean
        default: false
      base:
        description: "PR base branch (default main; point at a drill branch for testing)"
        type: string
        default: main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-version-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check and align agent versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute selected versions and apply alignment
        id: check
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A PAT with access to the private builds repo lets the watch read
          # draft releases and keeps the source URL/SHA in sync. Without it the
          # script reports "source-private" and leaves the npm pin alone.
          if [ -n "${AUTO_ALIGN_TOKEN:-}" ]; then
            export GH_TOKEN="$AUTO_ALIGN_TOKEN"
          fi
          bash .github/scripts/check-agent-versions.sh

      - name: Check manifest / installer / README consistency
        run: bash .github/scripts/check-versions-consistency.sh

      - name: Install shellcheck for pre-push validation
        if: steps.check.outputs.has_changes == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - uses: actions/setup-go@v5
        if: steps.check.outputs.has_changes == 'true'
        with:
          go-version-file: ccswitch-lite/go.mod

      # The auto/version-alignment branch must be trustworthy even if GitHub
      # does not start pull_request checks for a bot-created PR.
      - name: Pre-push validation (manifest, shellcheck, Go)
        if: steps.check.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          bash .github/scripts/check-versions-consistency.sh
          shellcheck -s sh install/install-loongarch-agents.sh
          shellcheck -s sh install/install-claude-code-loongarch.sh
          shellcheck -s sh install/install-zcode-loongarch.sh
          shellcheck -s sh install/install-cc-switch-loongarch.sh
          (
            cd ccswitch-lite
            go test ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=loong64 \
              go build -trimpath -ldflags "-s -w" -o /tmp/ccswitch-lite .
          )

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAITING_PORT: ${{ steps.check.outputs.waiting_port }}
        run: |
          set -euo pipefail
          gh label create agent-update \
            --color 0e8a16 \
            --description "Automated agent version watch" 2>/dev/null || true
          gh label create waiting-for-loong64-port \
            --color fbca04 \
            --description "Upstream is ahead but no LoongArch build exists yet" 2>/dev/null || true

          title="[agent-update] Agent 版本检查 $(date -u +%F)"
          number=$(gh issue list --label agent-update --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file issue-body.md \
              --add-label agent-update
            if [ "$WAITING_PORT" = true ]; then
              gh issue edit "$number" --add-label waiting-for-loong64-port
            else
              gh issue edit "$number" --remove-label waiting-for-loong64-port 2>/dev/null || true
            fi
            echo "issue=#${number} (updated)" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$WAITING_PORT" = true ]; then
              url=$(gh issue create --title "$title" --body-file issue-body.md \
                --label agent-update --label waiting-for-loong64-port)
            else
              url=$(gh issue create --title "$title" --body-file issue-body.md \
                --label agent-update)
            fi
            echo "issue=${url} (created)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update alignment PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN || secrets.GITHUB_TOKEN }}
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          BASE_REF: ${{ inputs.base || 'main' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry_run=true: skipping branch push and PR creation" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/version-alignment

          if [ -n "${AUTO_ALIGN_TOKEN:-}" ]; then
            # Push and open the PR as the PAT owner. Checks on PRs created by
            # github-actions[bot] wait in "action_required" until approved;
            # with a human-owned PAT they start automatically. The token is
            # only in the environment and is never written into the repo.
            git config --local --unset-all http.https://github.com/.extraheader || true
            gh auth setup-git
          fi

          # Validate exactly what is about to be pushed; do not rely on
          # pull_request checks that may not run for a bot-created PR.
          bash .github/scripts/check-versions-consistency.sh
          shellcheck -s sh install/install-loongarch-agents.sh
          shellcheck -s sh install/install-claude-code-loongarch.sh
          shellcheck -s sh install/install-zcode-loongarch.sh
          shellcheck -s sh install/install-cc-switch-loongarch.sh

          git add install/versions.env install/install-loongarch-agents.sh README.md
          if git diff --cached --quiet; then
            echo "nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: align agent versions with available LoongArch builds"
          git push --force-with-lease origin auto/version-alignment

          pr_title="chore: align agent versions ($(date -u +%F))"
          number=$(gh pr list --head auto/version-alignment --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$pr_title" --body-file changes.md
            echo "pr=#${number} (updated)" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base "$BASE_REF" --head auto/version-alignment \
              --title "$pr_title" --body-file changes.md)
            echo "pr=${url} (created)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write step summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Agent version check $(date -u +%F)"
            echo
            if [ -f version-table.md ]; then
              cat version-table.md
            else
              echo "Version check did not produce a table; see the job log."
            fi
            echo
            if [ -f changes.md ] && [ "${DRY_RUN:-false}" = "true" ]; then
              echo "Alignment changes were computed but not pushed (dry_run=true)."
            elif [ -f changes.md ]; then
              echo "Alignment changes were prepared; see the auto/version-alignment PR."
            else
              echo "No alignment changes: no PR created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
