name: ccswitch-lite

on:
  push:
    paths:
      - "ccswitch-lite/**"
      - "install/**"
      - "README.md"
      - ".github/scripts/**"
      - ".github/workflows/ccswitch-lite.yml"
  # Always run on pull requests so these jobs can be required checks; path
  # filters would leave docs-only PRs waiting forever for a check that never
  # starts.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccswitch-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build (linux/loong64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccswitch-lite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ccswitch-lite/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-build for loong64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: loong64
        run: go build -trimpath -ldflags "-s -w" -o ccswitch-lite .

      - name: Inspect binary
        run: file ccswitch-lite

      - name: Run acceptance tests
        run: |
          go build -trimpath -o ccswitch-lite-host .
          BIN="$PWD/ccswitch-lite-host" bash tests/test.sh

  shellcheck:
    name: Shellcheck install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check installer and wrappers
        run: |
          shellcheck -s sh install/install-loongarch-agents.sh
          shellcheck -s sh install/install-claude-code-loongarch.sh
          shellcheck -s sh install/install-zcode-loongarch.sh
          shellcheck -s sh install/install-cc-switch-loongarch.sh
          shellcheck -s sh install/codex install/dsh install/opencode
          shellcheck -s bash .github/scripts/check-agent-versions.sh
          shellcheck -s bash .github/scripts/check-versions-consistency.sh

  versions:
    name: Version manifest consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check versions.env against installer and README
        run: bash .github/scripts/check-versions-consistency.sh
