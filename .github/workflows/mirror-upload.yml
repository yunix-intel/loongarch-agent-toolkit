name: Stage agent binaries

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-agent-binaries
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stage published private build assets
        env:
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mirror-agent-assets.sh

      - name: Point to the manual promotion gate
        if: success()
        run: |
          echo "Assets staged in the draft \`agent-binaries-staging\` release." >> "$GITHUB_STEP_SUMMARY"
          echo "Review them, then run **Promote staged binaries** with confirm=PROMOTE." >> "$GITHUB_STEP_SUMMARY"
