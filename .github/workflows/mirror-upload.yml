name: Check agent binaries

# Read-only verification of the latest published private releases.  This never
# writes the public release.  A maintainer reviews the private releases and
# this report, then runs Promote staged binaries.
on:
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-agent-binaries
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the latest private assets
        env:
          AUTO_ALIGN_TOKEN: ${{ secrets.AUTO_ALIGN_TOKEN }}
          MODE: check
        run: bash scripts/mirror-agent-assets.sh
