[package]
name = "zcode-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
libc = "0.2"
url = "2"
signal-hook = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
